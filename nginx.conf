server {
    listen 80;
    
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy for Elasticsearch ESQL
    location /api/elastic/es {
        proxy_pass https://your-elastic-instance.com/_query/esql;
        proxy_http_version 1.1;
        proxy_set_header Host your-elastic-instance.com;
        # Note: In production, API keys are usually handled via backend or 
        # injected via environment variables if using a more complex setup.
    }

    # Proxy for Elastic Agent Builder
    location /api/elastic/agent {
        proxy_pass https://your-kibana-instance.com/api/agent_builder/converse;
        proxy_http_version 1.1;
        proxy_set_header Host your-kibana-instance.com;
    }
}
