server {
    listen 80;
    
    # Enable access and error logging to actual files (not stdout/stderr)
    # This allows Elastic Agent to collect them
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;
    
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy for Elasticsearch direct searches (ES endpoint)
    # Matches vite.config.js: /api/elastic/es -> removes prefix, forwards to ELASTIC_ES_URL
    location /api/elastic/ok-fraud/es {
        rewrite ^/api/elastic/ok-fraud/es(.*)$ $1 break;
        proxy_pass ${OK_ELASTIC_ES_URL};
        proxy_http_version 1.1;
        proxy_set_header Host ${OK_ELASTIC_ES_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/elastic/es {
        # Remove /api/elastic/es prefix and forward to Elasticsearch
        rewrite ^/api/elastic/es(.*)$ $1 break;
        proxy_pass ${ELASTIC_ES_URL};
        proxy_http_version 1.1;
        # Set Host header to match Elasticsearch domain (required for Elastic Cloud)
        proxy_set_header Host ${ELASTIC_ES_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Forward Authorization header if provided by client
        proxy_set_header Authorization $http_authorization;
    }

    # Elastic Workflows API on gawdzilla (alumni email / supervisor email / grant email)
    location /api/elastic/workflows/ {
        rewrite ^/api/elastic/workflows/(.*)$ /api/workflows/$1 break;
        proxy_pass ${OK_KIBANA_URL};
        proxy_http_version 1.1;
        proxy_set_header Host ${OK_KIBANA_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
    }

    # Agent Builder tool execute on gawdzilla (workflow tools for gameday-revenue-data)
    location /api/elastic/gameday-revenue-data/tools/_execute {
        rewrite ^/api/elastic/gameday-revenue-data/tools/_execute$ /api/agent_builder/tools/_execute break;
        proxy_pass ${OK_KIBANA_URL};
        proxy_http_version 1.1;
        proxy_set_header Host ${OK_KIBANA_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
    }

    # Agent Builder tool execute on gawdzilla (booster-donor-data workflow tools)
    location /api/elastic/booster-donor-data/tools/_execute {
        rewrite ^/api/elastic/booster-donor-data/tools/_execute$ /api/agent_builder/tools/_execute break;
        proxy_pass ${OK_KIBANA_URL};
        proxy_http_version 1.1;
        proxy_set_header Host ${OK_KIBANA_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
    }

    # Agent Builder tool execute on gawdzilla (workflow tools for ok-grants-data)
    location /api/elastic/ok-grants-data/tools/_execute {
        rewrite ^/api/elastic/ok-grants-data/tools/_execute$ /api/agent_builder/tools/_execute break;
        proxy_pass ${OK_KIBANA_URL};
        proxy_http_version 1.1;
        proxy_set_header Host ${OK_KIBANA_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
    }

    # Agent Builder tool execute on gawdzilla (workflow tools for ok-oja-data)
    location /api/elastic/ok-oja-data/tools/_execute {
        rewrite ^/api/elastic/ok-oja-data/tools/_execute$ /api/agent_builder/tools/_execute break;
        proxy_pass ${OK_KIBANA_URL};
        proxy_http_version 1.1;
        proxy_set_header Host ${OK_KIBANA_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
    }

    # Agent Builder streaming (SSE) on gawdzilla
    location ~ ^/api/elastic/agent/(ok-fraud|ok-grants-data|booster-donor-data|ok-oja-data|gameday-revenue-data|ou-met-catalog-agent|ou-met-provisioning-agent|snap-fraud-investigator|okstate-donor-assistant|okstate-gameday-revenue-assistant)/chat/stream$ {
        rewrite ^/api/elastic/agent/[^/]+/chat/stream$ /api/agent_builder/converse/async break;
        proxy_pass ${OK_KIBANA_URL};
        proxy_http_version 1.1;
        proxy_set_header Host ${OK_KIBANA_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # Agent Builder on gawdzilla (OK_KIBANA_URL): ok-fraud, okagency ok-grants-data, booster-donor-data
    location ~ ^/api/elastic/agent/(ok-fraud|ok-grants-data|booster-donor-data|ok-oja-data|gameday-revenue-data|ou-met-catalog-agent|ou-met-provisioning-agent|snap-fraud-investigator|okstate-donor-assistant|okstate-gameday-revenue-assistant)/chat$ {
        rewrite ^/api/elastic/agent/[^/]+/chat$ /api/agent_builder/converse break;
        proxy_pass ${OK_KIBANA_URL};
        proxy_http_version 1.1;
        proxy_set_header Host ${OK_KIBANA_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Agent Builder streaming (SSE) for other agents -> ELASTIC_KB_URL
    location ~ ^/api/elastic/agent/([^/]+)/chat/stream$ {
        rewrite ^/api/elastic/agent/[^/]+/chat/stream$ /api/agent_builder/converse/async break;
        proxy_pass ${ELASTIC_KB_URL};
        proxy_http_version 1.1;
        proxy_set_header Host ${ELASTIC_KB_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # Proxy for Agent Builder chat endpoint (other agents -> ELASTIC_KB_URL)
    location ~ ^/api/elastic/agent/([^/]+)/chat$ {
        # Rewrite to the target endpoint (required for regex locations)
        rewrite ^/api/elastic/agent/[^/]+/chat$ /api/agent_builder/converse break;
        proxy_pass ${ELASTIC_KB_URL};
        proxy_http_version 1.1;
        proxy_set_header Host ${ELASTIC_KB_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Catch-all for other /api/elastic routes
    # Matches vite.config.js: removes /api/elastic prefix, forwards to ELASTIC_KB_URL
    location /api/elastic {
        # Remove /api/elastic prefix
        rewrite ^/api/elastic(.*)$ $1 break;
        proxy_pass ${ELASTIC_KB_URL};
        proxy_http_version 1.1;
        proxy_set_header Host ${ELASTIC_KB_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

}
