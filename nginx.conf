server {
    listen 80;
    
    # Enable access and error logging to actual files (not stdout/stderr)
    # This allows Elastic Agent to collect them
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;
    
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy for Elasticsearch direct searches (ES endpoint)
    # Matches vite.config.js: /api/elastic/es -> removes prefix, forwards to ELASTIC_ES_URL
    location /api/elastic/es {
        # Remove /api/elastic/es prefix and forward to Elasticsearch
        rewrite ^/api/elastic/es(.*)$ $1 break;
        proxy_pass ${ELASTIC_ES_URL};
        proxy_http_version 1.1;
        # Set Host header to match Elasticsearch domain (required for Elastic Cloud)
        proxy_set_header Host ${ELASTIC_ES_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Forward Authorization header if provided by client
        proxy_set_header Authorization $http_authorization;
    }

    # Proxy for Agent Builder chat endpoint
    # Matches vite.config.js: /api/elastic/agent/{agent_id}/chat -> /api/agent_builder/converse
    location ~ ^/api/elastic/agent/([^/]+)/chat$ {
        # Rewrite to the target endpoint (required for regex locations)
        rewrite ^/api/elastic/agent/[^/]+/chat$ /api/agent_builder/converse break;
        proxy_pass ${ELASTIC_KB_URL};
        proxy_http_version 1.1;
        proxy_set_header Host ${ELASTIC_KB_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Catch-all for other /api/elastic routes
    # Matches vite.config.js: removes /api/elastic prefix, forwards to ELASTIC_KB_URL
    location /api/elastic {
        # Remove /api/elastic prefix
        rewrite ^/api/elastic(.*)$ $1 break;
        proxy_pass ${ELASTIC_KB_URL};
        proxy_http_version 1.1;
        proxy_set_header Host ${ELASTIC_KB_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

}
