<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Scholarship Demo</title>
    <!-- Environment variables will be injected here by docker-entrypoint.sh -->
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-[var(--bg-base)] text-white min-h-screen" style="background-color: var(--bg-base);">
    <div id="app" class="flex items-center justify-center min-h-screen">
        <div class="text-center px-4">
            <h1 
                data-template="heroTitle"
                class="text-6xl font-black tracking-tighter mb-4 bg-gradient-to-br from-white to-white/60 bg-clip-text text-transparent"
            >
                Loading...
            </h1>
            <p 
                data-template="heroSubtitle"
                class="text-white/60 text-lg mb-8"
            >
                Initializing...
            </p>
            <div class="flex gap-4 justify-center">
                <button 
                    class="px-8 py-3 rounded-full bg-[var(--primary-color)] hover:opacity-90 transition-opacity font-semibold"
                    style="background-color: var(--primary-color);"
                >
                    <span data-template="ctaText">Get Started</span>
                </button>
                <button 
                    class="px-8 py-3 rounded-full border border-white/10 hover:border-white/20 transition-colors font-semibold"
                >
                    <span data-template="ctaSecondary">Learn More</span>
                </button>
            </div>
        </div>
    </div>
    <script type="module" src="/js/main.js"></script>
</body>
</html>
